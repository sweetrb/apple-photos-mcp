# pnpm workspace config. Single-package repo — this file exists mainly to carry
# the build-script approvals below. pnpm 11 reads build-script consent ONLY from
# `allowBuilds` here (the v10 `onlyBuiltDependencies`, the package.json `pnpm`
# field, and `.npmrc` are all ignored). Without approving esbuild, `pnpm install`
# fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true

# Pin pnpm 11's supply-chain minimum-release-age default explicitly (1440 min = 1 day)
# so it is documented and stable across pnpm upgrades. See https://pnpm.io/supply-chain-security.
minimumReleaseAge: 1440

# The MCP SDK currently caps these transitive dependencies below their first
# fully patched releases. Keep the overrides until the SDK's ranges move past
# these security fixes.
overrides:
  "@hono/node-server": 2.0.10
  # GHSA-mh99-v99m-4gvg / CVE-2026-14257 (high): unbounded brace expansion.
  # Dev toolchain only -- brace-expansion is not in the shipped bundle -- but
  # three separate majors are reachable here (eslint -> minimatch@3 -> v1,
  # minimatch@9 -> v2, minimatch@10 -> v5), so each is floored independently
  # on its own complete release.
  #
  # The advisory's first-patched versions (1.1.17 / 2.1.3 / 5.0.8) are NOT
  # sufficient: they bound the accumulator in combine() but never thread
  # maxLength into expandSequence(), leaving the sequence path ({1..N},
  # {a..z..k}) capped only by item count. 1.1.18 / 2.1.4 / 5.0.9 add it.
  #
  # The bounds must be two-sided. A bare "<5.0.9" also matches 1.1.18 and
  # 2.1.4 under semver, and would force minimatch 3's CommonJS path onto the
  # v5 ESM API ("expand is not a function").
  "brace-expansion@>=1.0.0 <1.1.18": 1.1.18
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.4
  "brace-expansion@>=5.0.0 <5.0.9": 5.0.9
  # GHSA-7p8r-x3mc-p8w7 (high): fast-uri URI parsing can be coerced into
  # mis-parsing, fixed in 3.1.5. Reached as ajv -> @modelcontextprotocol/sdk,
  # and ajv is inlined into the shipped build/index.js bundle, so this one is
  # genuinely in the product, not just the dev toolchain.
  #
  # This MUST stay a caret range, not an exact pin. It was written as the exact
  # pin "3.1.4" as a security floor for an earlier advisory; when 3.1.5 shipped
  # the fix, that pin silently inverted into a CEILING that held the tree on
  # the vulnerable version and made the advisory unclearable. A caret keeps us
  # inside the major ajv expects while letting patch fixes flow in.
  fast-uri: ^3.1.5
  # GHSA-mwp4-54f8-5fhr (high), plus GHSA-4xrf-jv44-h6hh and
  # GHSA-22jq-vg5j-6vgg: fixed in 10.3.1. Reached as express-rate-limit ->
  # @modelcontextprotocol/sdk, which caps it at 10.2.0. Not present in the
  # shipped bundle (the SDK's HTTP transport is not bundled), so this is a
  # supply-chain floor rather than a runtime exposure -- but the dependency is
  # runtime-scope, so keep it floored.
  ip-address: ^10.3.1
  # GHSA-fxqj-rqcc-2cmp (moderate): incomplete fix of GHSA-6g55-p6wh-862q --
  # an attacker-controlled sourceMappingURL can read arbitrary .map files when
  # `from` is unset. Fixed in 8.5.23. Development scope only (vitest -> vite ->
  # postcss) and not in the shipped bundle, but vite's own range is ^8.5.6, so
  # the caret floor is free.
  postcss: ^8.5.23
  # DEFERRED -- GHSA-8j4g-w8fx-2239 (moderate) is fixed in hono 4.12.34, but
  # that release (published 2026-08-03T02:36:40Z) was still inside the
  # 1440-minute minimumReleaseAge soak declared above when this landed, so
  # `pnpm install` rejects it with ERR_PNPM_NO_MATURE_MATCHING_VERSION.
  # Reached as @hono/node-server -> @modelcontextprotocol/sdk, and NOT present
  # in the shipped build/index.js bundle, so the exposure is supply-chain only.
  # Follow-up: add `hono: ^4.12.34` once the release has matured. Do NOT add a
  # minimumReleaseAgeExclude carve-out -- the soak is deliberate.
